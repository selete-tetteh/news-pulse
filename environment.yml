  - pip
  - jupyter
  - ipykernel
  - pandas
  - numpy
  - matplotlib
  - seaborn
  - scikit-learn
  - scipy
  - statsmodels
  - networkx
  - sqlalchemy
  - pymysql
  - python-dotenv
